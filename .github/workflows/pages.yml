# Publishes the iPhone/web version of Pitch Pal to GitHub Pages on every push to main,
# and every hour rebuilds news.json (news sites block reading their feeds from a web page directly).
name: Web app

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Collect the web app files
        run: |
          mkdir _site
          cp index.html core.js gb.js sfx.js news.js reading.js sw.js manifest.webmanifest _site/
          cp -r fonts icons _site/
      - name: Build today's news
        run: |
          # Start from the last published stories so a source that fails this hour keeps its old ones.
          curl -fsSL "${{ steps.pages.outputs.base_url }}/news.json" -o _site/news.json || true
          npm install --no-save --no-audit --no-fund linkedom@0.18.5
          node scripts/build-news.js _site/news.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
